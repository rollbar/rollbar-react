name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Let every runtime report rather than cancelling its siblings on the
      # first failure -- but the job itself must still fail the run.
      fail-fast: false
      matrix:
        include:
          # Next.js 16 (used by the examples) requires node >= 20.9, so 20 is
          # the floor. 22 and 24 are the maintained LTS lines.
          - node: 20
            npm: 10
          - node: 22
            npm: 10
          - node: 24
            npm: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Update npm
        run: npm install -g npm@^${{ matrix.npm }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-
            ${{ runner.os }}-node-
            ${{ runner.os }}-

      - name: Install
        run: npm run install:all -- ci

      - name: Lint
        uses: wearerequired/lint-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prettier: true
          eslint: true
          eslint_args: '--max-warnings 0'
          eslint_extensions: js,jsx,mjs,cjs,ts,tsx

      - name: Lint examples
        run: npm run lint:examples

      - name: Build
        run: npm run build:all

      - name: Test
        run: npm run test

      - name: Test examples
        run: npm run test:examples

  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm run install:all
